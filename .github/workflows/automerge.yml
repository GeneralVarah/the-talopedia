name: Auto-merge
# A page edit from the editor arrives as a pull request, and every one of them was
# being merged by hand. A nation's edits to its own pages merge themselves; anything
# touching another nation's page, a communal one, or anything that is not a page at
# all is left open. .github/gate.mjs holds the rule and says why it declined.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
permissions: { contents: write, pull-requests: write, actions: write }
concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  # The commit the event named. Every step works from this one rather than from
  # whatever the branch points at now, so a push landing mid-run cannot slip past
  # a gate that has already read something else.
  SHA: ${{ github.event.pull_request.head.sha }}
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      # main, never the pull request's own copy. The rule and the bylines it reads
      # have to be the ones already on the branch being merged into, or a pull request
      # could rewrite either in the act of passing them. The whole history, because
      # the gate diffs against the merge base.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - id: gate
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ADMIN: ${{ github.repository_owner }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "pull/${{ github.event.pull_request.number }}/head"
          verdict=$(node .github/gate.mjs)
          echo "$verdict" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$verdict" = merge ] && echo "go=1" >> "$GITHUB_OUTPUT" || true

      # The pages the pull request writes, dropped into main's own tree. Never a
      # checkout of the fork itself: this job holds a token that can write here, so
      # building a fork's code in it is the pwn-request hole actions/checkout refuses
      # by default. The gate has already established that the pull request touches
      # nothing but content, so main's tree carrying its content is its tree.
      - if: steps.gate.outputs.go
        run: git checkout "$SHA" -- src/content public/assets
      - if: steps.gate.outputs.go
        uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - if: steps.gate.outputs.go
        run: npm ci
      - if: steps.gate.outputs.go
        run: npm run build

      - if: steps.gate.outputs.go
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr merge "$PR" --repo "$REPO" --squash --match-head-commit "$SHA"
          # A merge made with the workflow's own token raises no push event, so the
          # site would never rebuild. workflow_dispatch is the documented exception.
          gh workflow run deploy.yml --repo "$REPO"
