name: Auto-merge
# A page edit from the editor arrives as a pull request, and every one of them was
# being merged by hand. A nation's edits to its own pages merge themselves; anything
# touching another nation's page, a communal one, or anything that is not a page at
# all is left open. .github/gate.mjs holds the rule and says why it declined.
#
# The merge itself is .github/land.mjs: each page is merged against the copy its
# writer opened, which the editor records on every commit. A contributor's fork is
# often days behind main, and GitHub's own merge, starting from that old fork, saw
# every page as changed on both sides and refused.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
permissions: { contents: write, pull-requests: write, actions: write }
concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  # The commit the event named. Every step works from this one rather than from
  # whatever the branch points at now, so a push landing mid-run cannot slip past
  # a gate that has already read something else.
  SHA: ${{ github.event.pull_request.head.sha }}
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      # main, never the pull request's own copy. The rule and the bylines it reads
      # have to be the ones already on the branch being merged into, or a pull request
      # could rewrite either in the act of passing them. The whole history, because
      # the gate diffs against the merge base and a page merges against the copy of
      # main its writer opened.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - id: gate
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ADMIN: ${{ github.repository_owner }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "pull/${{ github.event.pull_request.number }}/head"
          verdict=$(node .github/gate.mjs)
          echo "$verdict" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$verdict" = merge ] && echo "go=1" >> "$GITHUB_OUTPUT" || true

      # Stages the merged pages on main's own tree. An edit from an older editor has
      # no record of its copy and goes to GitHub's merge, as before. Never a checkout
      # of the fork itself: this job holds a token that can write here, and the gate
      # has already established that nothing outside the content tree changed.
      - id: land
        if: steps.gate.outputs.go
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          result=$(node .github/land.mjs)
          echo "$result" | tee -a "$GITHUB_STEP_SUMMARY"
          case "$result" in
            ready) echo "mode=land" >> "$GITHUB_OUTPUT" ;;
            fallback)
              git checkout "$SHA" -- src/content public/assets
              echo "mode=merge" >> "$GITHUB_OUTPUT" ;;
          esac

      - if: steps.land.outputs.mode
        uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - if: steps.land.outputs.mode
        run: npm ci
      - if: steps.land.outputs.mode
        run: npm run build

      # One commit on main under the writer's name, carrying their own edit summary:
      # that is what the History tab reads. GitHub only calls a pull request merged
      # when its own commits land, and those were made on the old copy, so it is
      # closed with a note instead. If main moves meanwhile, land again on top of it.
      - if: steps.land.outputs.mode == 'land'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GIT_AUTHOR_NAME: ${{ github.event.pull_request.user.login }}
          GIT_AUTHOR_EMAIL: ${{ github.event.pull_request.user.id }}+${{ github.event.pull_request.user.login }}@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          [ "$(git rev-list --count HEAD.."$PR_HEAD")" = 1 ] && subject=$(git log -1 --format=%s "$PR_HEAD") || subject="$TITLE"
          for attempt in 1 2 3; do
            commit=$(git commit-tree "$(git write-tree)" -p HEAD -m "$subject (#$PR)")
            git push -q origin "$commit:refs/heads/main" && break
            [ "$attempt" = 3 ] && exit 1
            git fetch -q origin main
            git reset -q --hard origin/main
            again=$(node .github/land.mjs)
            if [ "$again" != ready ]; then echo "$again" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          done
          gh pr close "$PR" --repo "$REPO" --comment "Landed on the wiki as $commit. It goes live with the next deploy, which has just started."
          # A push made with the workflow's own token raises no push event, so the
          # site would never rebuild. workflow_dispatch is the documented exception.
          gh workflow run deploy.yml --repo "$REPO"

      - if: steps.land.outputs.mode == 'merge'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr merge "$PR" --repo "$REPO" --squash --match-head-commit "$SHA"
          gh workflow run deploy.yml --repo "$REPO"
