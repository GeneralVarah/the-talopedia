name: Deploy
on:
  push: { branches: [main] }
  # The front page features a different article each day, picked at build time, so
  # the site rebuilds itself shortly after midnight UTC whether or not anyone edited.
  schedule: [{ cron: '7 0 * * *' }]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # The contributors page is built from the log, so the whole history is needed.
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      # Runs before the build, not after it: the build reads the outputs below, and a
      # step cannot read outputs from a step that has not run yet.
      - uses: actions/configure-pages@v6
        id: pages
      - run: npm ci
      # base_path is "/<repo>" for a project site and "/" for <user>.github.io, so the
      # site follows a rename on its own. Set a BASE_PATH repository variable to override.
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ vars.BASE_PATH || steps.pages.outputs.base_path }}
          # The repository the editor opens pull requests against, so a rename carries.
          GITHUB_REPO: ${{ github.repository }}
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
